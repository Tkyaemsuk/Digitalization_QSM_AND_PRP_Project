<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="300" viewBox="0 0 1600 300" role="img" aria-labelledby="title desc">
  <title id="title">Digitalization QSM and PRP Project</title>
  <desc id="desc">Quality System Management, UHT and PRP digitalization project</desc>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="45%" stop-color="#1D4ED8"/>
      <stop offset="75%" stop-color="#0891B2"/>
      <stop offset="100%" stop-color="#14B8A6"/>
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#67E8F9" stop-opacity="0"/>
      <stop offset="50%" stop-color="#FFFFFF" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#67E8F9" stop-opacity="0"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="5" stdDeviation="7" flood-color="#020617" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect width="1600" height="300" rx="24" fill="url(#bg)"/>
  <circle cx="1380" cy="-20" r="260" fill="#FFFFFF" opacity="0.08"/>
  <circle cx="1510" cy="250" r="190" fill="#67E8F9" opacity="0.10"/>
  <circle cx="90" cy="275" r="230" fill="#14B8A6" opacity="0.12"/>
  <path d="M0 245 C250 170 420 315 680 235 S1110 155 1600 230 V300 H0Z" fill="#020617" opacity="0.18"/>
  <rect x="310" y="205" width="980" height="3" rx="2" fill="url(#glow)"/>

  <g text-anchor="middle" fill="#FFFFFF" filter="url(#shadow)">
    <text x="800" y="120" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="700" letter-spacing="1">Digitalization QSM &amp; PRP</text>
    <text x="800" y="165" font-family="Arial, Helvetica, sans-serif" font-size="22" letter-spacing="3" opacity="0.92">QUALITY SYSTEM MANAGEMENT  •  UHT  •  PRP</text>
    <text x="800" y="250" font-family="Arial, Helvetica, sans-serif" font-size="20" opacity="0.9">Digital Transformation for Quality, Accuracy and Traceability</text>
  </g>
</svg>
